#  ◈ KITTY TERMINAL — Ultimate Catppuccin Masterpiece (Animated Cursor Edition)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Typography ──────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.5

# Precise typographic tuning
modify_font cell_width  100%
modify_font cell_height 122%
modify_font baseline    0

# ── Animated Cursor Motion & Typing Glow ────────────────────────────────────────
cursor_shape                beam
cursor_beam_thickness       2.2
cursor_blink_interval       0.35
cursor_stop_blinking_after  15.0
cursor_trail                15
cursor_trail_decay          0.04 0.30
cursor_trail_start_threshold 0

# ── Mouse Cursor & Interaction ──────────────────────────────────────────────────
mouse_hide_wait             1.5
default_pointer_shape       beam
pointer_shape_when_grabbed  hand
pointer_shape_when_dragging beam

# ── Window Styling & Glassmorphism ──────────────────────────────────────────────
background_opacity    0.85
background_blur       1
hide_window_decorations yes
confirm_os_window_close 0

window_padding_width  16 20
placement_strategy    center

# ── Scrollback & Mouse Selection ────────────────────────────────────────────────
scrollback_lines      10000
wheel_scroll_min_lines 1
copy_on_select        yes
strip_trailing_spaces smart

# ── Audio & Bell ────────────────────────────────────────────────────────────────
enable_audio_bell     no
visual_bell_duration  0.0

# ── Tab Bar (Powerline Slanted) ─────────────────────────────────────────────────
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      2
tab_title_template    " {fmt.fg.tab}󰅂 {title} "
active_tab_font_style bold

# ── URL & Hyperlink Handling ────────────────────────────────────────────────────
url_style             curly
detect_urls           yes
underline_hyperlinks  hover

# ── Performance & Remote Control ────────────────────────────────────────────────
repaint_delay         6
input_delay           1
sync_to_monitor       yes
allow_remote_control  yes
listen_on             unix:@mykitty

# ── Shell Integration ───────────────────────────────────────────────────────────
shell_integration     enabled

# ── Window Layouts & Splitting ──────────────────────────────────────────────────
enabled_layouts       splits,stack,tall,fat,grid

# Keybindings for Split Panes & Tabs
map ctrl+shift+enter launch --cwd=current --type=window
map ctrl+shift+t     launch --cwd=current --type=tab
map ctrl+shift+z     toggle_layout stack

# Window Navigation
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

# Resize Windows
map ctrl+shift+r     start_resizing_window

# ── Theme Import ────────────────────────────────────────────────────────────────
include ~/.config/kitty/catppuccin-mocha.conf
