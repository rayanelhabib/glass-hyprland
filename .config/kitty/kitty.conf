#  ◈ KITTY TERMINAL — Catppuccin Mocha Human-Crafted Edition
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Typography ──────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.5

# Precise typographic tuning
modify_font cell_width  100%
modify_font cell_height 122%
modify_font baseline    0

# ── Cursor Motion ───────────────────────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.45
cursor_trail          3
cursor_trail_decay    0.1 0.4
cursor_trail_start_threshold 2

# ── Window Styling & Glassmorphism ──────────────────────────────────────────────
background_opacity    0.85
background_blur       1
hide_window_decorations yes
confirm_os_window_close 0

window_padding_width  16 20
placement_strategy    center

# ── Scrollback & Mouse ──────────────────────────────────────────────────────────
scrollback_lines      10000
wheel_scroll_min_lines 1

# ── Audio & Bell ────────────────────────────────────────────────────────────────
enable_audio_bell     no
visual_bell_duration  0.0

# ── Tab Bar (Powerline Slanted) ─────────────────────────────────────────────────
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      2
tab_title_template    " {fmt.fg.tab}{title} "
active_tab_font_style bold

# ── URL ─────────────────────────────────────────────────────────────────────────
url_style             curly
detect_urls           yes

# ── Performance ─────────────────────────────────────────────────────────────────
repaint_delay         6
input_delay           1
sync_to_monitor       yes

# ── Theme Import ────────────────────────────────────────────────────────────────
include ~/.config/kitty/catppuccin-mocha.conf
