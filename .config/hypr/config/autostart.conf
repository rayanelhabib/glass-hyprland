# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE QT_QPA_PLATFORM
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE QT_QPA_PLATFORM
exec-once = hyprctl seterror disable
# hyprglass MUST be loaded here, not from config/plugins.lua — loading a plugin
# during config load makes Hyprland 0.56.1 recurse and segfault the session.
exec-once = ~/.config/hypr/scripts/hyprglass_startup.sh
exec-once = ~/.config/hypr/scripts/window_clamp.sh
exec-once = ~/.config/hypr/scripts/floating_drag.sh
exec-once = ~/.config/hypr/scripts/fix_antigravity_locks.sh
exec-once = systemctl --user start hyprpolkitagent
exec-once = awww-daemon
exec-once = hypridle
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/Shell.qml
exec-once = ~/.config/hypr/scripts/quickshell/focustime/launch_daemon.sh
exec-once = ~/.config/hypr/scripts/init.sh
exec-once = ~/.config/hypr/scripts/settings_watcher.sh &
exec-once = playerctld
exec-once = swayosd-server --top-margin 0.9 --style "$HOME/.config/swayosd/style.css"
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.config/hypr/scripts/volume_listener.sh
exec-once = ~/.config/hypr/scripts/update_notifier.sh
exec-once = bash -c 'amixer -c 2 sset "Mic Boost" 3 2>/dev/null; amixer -c 2 sset Capture cap 100% 2>/dev/null; wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 1.30'
exec-once = bash -c 'sleep 1 && ~/.config/hypr/scripts/qs_manager.sh toggle guide'
