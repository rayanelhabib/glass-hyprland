#  ◈ ENVIRONMENT VARIABLES (AUTOGENERATED)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

env = NIXOS_OZONE_WL,1
env = XDG_PICTURES_DIR,/home/rayan
env = XDG_VIDEOS_DIR,/home/rayan
env = WALLPAPER_DIR,/home/rayan/Pictures/Wallpapers
env = SCRIPT_DIR,/home/rayan/.config/hypr/scripts
env = QT_QPA_PLATFORMTHEME,qt6ct
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

# Hardware Injections
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = __NV_PRIME_RENDER_OFFLOAD,1
env = __NV_PRIME_RENDER_OFFLOAD_PROVIDER,NVIDIA-G0
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0
env = __GL_SHADER_DISK_CACHE,1
env = __GL_SHADER_DISK_CACHE_PATH,/home/rayan/.cache/nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia

# Safety net for hyprglass: if the ABI check ever fails, warn instead of aborting
# the compositor (plugin is built against 0.56.1 headers like the running build).
env = HYPRGLASS_SKIP_VERSION_CHECK,1
