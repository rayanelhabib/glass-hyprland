#  ◈ PLUGIN LOADING & CONFIG (hyprglass)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# NOTE: hyprglass must be loaded at STARTUP (config `plugin =`). Hot-loading it
# at runtime (hyprctl plugin load/reload/unload) crashes Hyprland — the crashes
# were NOT a version issue. Rebuilt against 0.56.1 headers.
plugin = /home/rayan/.local/share/hyprglass/hyprglass.so

plugin:hyprglass {
    # Windows keep their normal look; glass is enabled ONLY on the quickshell
    # master layer surface (qs-master) via the `layers` block below.
    enabled = 0

    default_theme = dark
    default_preset = qsglass

    layers {
        enabled = 1
        namespaces = qs-master, qs-topbar, qs-floating-overlay, qs-popups
        namespace_presets = qs-master:qsglass, qs-topbar:qsglassbar, qs-floating-overlay:qsglass, qs-popups:qsglass
        namespace_mask_thresholds = qs-master=0.01
        # Live mirror: re-sample the backdrop every frame so moving content
        # behind the glass (animated wallpaper, video) shows through in real
        # time instead of a cached snapshot.
        live_refresh = 1
    }

    # Liquid glass (per hyprnux/hyprglass "glass" preset + the purple-lines
    # shader recipe): keep the backdrop sharp (light blur), strong edge
    # refraction + chromatic, glossy specular highlights. NO tint, NO frost
    # veil — the backdrop's own color IS the glass. Dark override only
    # neutralizes the dimming/desaturation defaults that caused the grey cast.
    # Real-glass recipe: the backdrop passes through UNTOUCHED (zero blur, no
    # tint, no brightness/saturation change — nothing to add colour or grey).
    # The liquid look is carried entirely by the edge effects: refraction warp,
    # chromatic fringing, lens distortion and specular gloss on the rim.
    # Liquid glass per the reference repos (hyprnux/hyprglass "glass" preset,
    # purple-lines shader, kdelg liquid-glass widgets):
    #   - interior: backdrop passes through untouched (blur 0, tint 0) = real glass
    #   - liquid: wide edge band with strong Snell refraction + chromatic fringing
    #   - gloss: hyprglass scales specular by 0.08 internally, so the reference's
    #     visible highlight needs specular_strength ~3-4; fresnel likewise needs ~1.5
    preset = name:qsglass, inherits:glass, blur_strength:0.0, blur_iterations:1, lens_distortion:0.3, refraction_strength:10.0, chromatic_aberration:0.0, fresnel_strength:0.3, specular_strength:1.6, glass_opacity:1.0, edge_thickness:0.02, tint_color:0x00000000
    # Topbar variant: same liquid glass but with a gentle backdrop blur
    # (~7px at blur_strength 0.6) so content behind the bar softens slightly.
    preset = name:qsglassbar, inherits:qsglass, blur_strength:1.0, blur_iterations:2, refraction_strength:2.0, specular_strength:0.6, fresnel_strength:0.1, edge_thickness:0.006
    preset = name:qsglass:dark, brightness:1.0, contrast:1.0, saturation:1.0, adaptive_dim:0.0, adaptive_boost:0.0
    preset = name:qsglass:light, brightness:1.0, contrast:1.0, saturation:1.0, adaptive_dim:0.0, adaptive_boost:0.0, tint_color:0x00000000
}
