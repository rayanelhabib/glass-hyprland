# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ HYPRIDLE CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Every lock trigger below goes through scripts/lock.sh, never a bare
# `quickshell ... Lock.qml` and never `loginctl lock-session`:
#
#   * A bare quickshell launch skips lock.sh's duplicate-instance guards. Two
#     Lock.qml processes means two ext-session-lock clients; Hyprland answers
#     the second with `denied`, and Quickshell's WlSessionLock exposes no
#     `denied` signal, so the extra lock screen never learns it was rejected.
#   * `loginctl lock-session` is a logind/greeter lock, not a Wayland session
#     lock. It does not blank the session through ext-session-lock, and it
#     hands the display to the SDDM greeter, which is what makes it look like
#     the machine dropped you back at the login screen.
#
# Hyprland's ext-session-lock never terminates clients: locking only blanks
# output and inhibits input, and if the lock client dies Hyprland simply
# releases the lock. Running apps are not affected by locking or unlocking.
general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = ~/.config/hypr/scripts/lock.sh

    # 3 = block suspend until a session-lock app has actually locked the
    # session. Works with any Wayland session-lock app, unlike the default
    # auto mode which only detects hyprlock. Waking the display afterwards is
    # handled by misc:key_press_enables_dpms / mouse_move_enables_dpms.
    inhibit_sleep = 3
}

listener {
    timeout = 600
    on-timeout = ~/.config/hypr/scripts/lock.sh
}

listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
