[Unit]
# The vendor unit has Restart=on-failure with no RestartSec, so when the agent
# cannot reach a compositor socket it respawns in a tight loop (observed ~5
# restarts in 2 seconds). Rate-limit it instead of burning CPU and flooding
# the journal.
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
# Force the Wayland Qt platform and wait for the compositor socket so the
# agent never falls back to xcb (fails here: libxcb-cursor0 not installed).
Environment=QT_QPA_PLATFORM=wayland
ExecStartPre=/bin/sh -c 'SOCK="${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY:-wayland-0}"; i=0; while [ $i -lt 50 ] && [ ! -S "$SOCK" ]; do sleep 0.2; i=$((i+1)); done; [ -S "$SOCK" ]'
RestartSec=3